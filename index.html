<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Peach</title>
<meta name="description" content="Programme de musculation guidé sur 6 jours avec minuteur de repos sonore." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Peach" />
<meta name="theme-color" content="#1c0f18" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" />

<style>
:root{
  color-scheme:dark;
  --paper:#1c0f18;
  --surface:#281521;
  --surface-tint:#34192b;
  --ink:#ffe0ef;
  --ink-soft:#d68fb3;
  --on-rose:#ffe6f1;
  --rose:#ff2e88;
  --rose-deep:#ff8fc0;
  --rose-soft:#45203a;
  --fonte:#d99cc0;
  --fonte-soft:#38222f;
  --line:#452136;
  --success:#ff5cc8;
  --success-soft:#4a1f42;
  --shadow:0 16px 32px -18px rgba(40,8,28,0.6);
  --shadow-sm:0 6px 14px -10px rgba(40,8,28,0.5);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:"Fraunces",ui-serif,Georgia,serif;
  text-wrap:balance;
  margin:0;
}
p{margin:0;}
button{font-family:inherit;}
.app{
  max-width:560px;
  margin:0 auto;
  padding:18px 16px 120px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

/* ---------- topbar ---------- */
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:4px 2px;
}
.brand{display:flex;align-items:center;gap:12px;}
.eyebrow{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 3px;
}
.wordmark{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:"Figtree",-apple-system,sans-serif;
  font-size:28px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--rose);
  line-height:1;
}
.wordmark svg{width:17px;height:17px;flex:none;color:var(--rose-deep);}
.tagline{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-top:4px;
  font-style:italic;
}
.week-chip{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface-tint);
  color:var(--rose-deep);
  border:1px solid var(--line);
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.week-chip svg{width:14px;height:14px;flex:none;}
.header-right{display:flex;align-items:center;gap:8px;flex:none;}
.unit-chip{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--fonte);
  font-size:12px;
  font-weight:800;
  padding:8px 11px;
  border-radius:999px;
  cursor:pointer;
  flex:none;
  align-self:flex-start;
}
.unit-chip:active{transform:scale(.95);}
.icon-chip{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;}
.icon-chip svg{width:16px;height:16px;}

/* ---------- stats row ---------- */
.stats-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:2px;
  box-shadow:var(--shadow-sm);
}
.stat-card .num{
  font-family:"Fraunces",serif;
  font-size:28px;
  font-weight:600;
  color:var(--rose);
  display:flex;
  align-items:center;
  gap:7px;
  font-variant-numeric:tabular-nums;
}
.stat-card .num svg{width:19px;height:19px;flex:none;}
.stat-card .num-sub{font-size:16px;color:var(--ink-soft);font-weight:500;}
.stat-card .label{
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--ink-soft);
}

/* ---------- week strip ---------- */
.week-strip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day-pill{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:10px 2px 9px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  position:relative;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.day-pill:active{transform:scale(.96);}
.day-pill .dow{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--ink-soft);
  text-transform:uppercase;
}
.day-pill .code{
  font-size:12px;
  font-weight:800;
  color:var(--ink);
  letter-spacing:.02em;
}
.day-pill .bar{
  width:20px;height:3px;border-radius:2px;
  background:var(--line);
}
.day-pill[data-muscle="rest"] .bar{background:var(--fonte-soft);}
.day-pill[data-selected="true"]{
  border-color:var(--rose);
  box-shadow:var(--shadow-sm);
  background:var(--surface-tint);
}
.day-pill[data-selected="true"] .bar{background:var(--rose);}
.day-pill[data-today="true"]::after{
  content:"";
  position:absolute;
  top:6px;right:6px;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--rose);
}
.day-pill[data-done="true"] .code{color:var(--success);}
.day-pill[data-done="true"] .bar{background:var(--success);}

/* ---------- morning quick access ---------- */
.morning-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
}
.morning-card:active{transform:scale(.99);}
.morning-card-text h3{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:2px;}
.morning-card-text p{font-size:12.5px;color:var(--ink-soft);}
.chevron-right{flex:none;width:20px;height:20px;color:var(--ink-soft);transform:rotate(-90deg);}
.chevron-right svg{width:100%;height:100%;}
.rest-changer{
  background:none;
  border:none;
  color:var(--rose);
  font-size:13px;
  font-weight:700;
  text-decoration:underline;
  cursor:pointer;
  padding:4px;
}

/* ---------- pilates tracker ---------- */
.pilates-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:var(--shadow-sm);
}
.pilates-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.pilates-head h3{font-size:15px;font-weight:700;color:var(--ink);}
.pilates-sub{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-top:2px;}
.pilates-streak{display:flex;align-items:center;gap:5px;color:var(--rose);font-weight:800;font-size:15px;flex:none;}
.pilates-streak svg{width:16px;height:16px;}
.pilates-toggle{
  border:1.5px solid var(--rose);
  background:transparent;
  color:var(--rose);
  font-weight:700;
  font-size:13.5px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.pilates-toggle svg{width:16px;height:16px;}
.pilates-toggle[data-went="true"]{background:var(--rose);color:var(--on-rose);}
.pilates-focus{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.pilates-focus label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.pilates-focus select{
  background:var(--paper);
  border:1.5px solid var(--line);
  color:var(--ink);
  font-weight:700;
  font-size:13px;
  padding:8px 10px;
  border-radius:10px;
}

/* ---------- history / calendar ---------- */
.history-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:4px 2px;
}
.history-nav h3{font-size:16px;font-weight:700;color:var(--ink);}
.hist-nav-btn{
  width:34px;height:34px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex:none;
}
.hist-nav-btn svg{width:16px;height:16px;transform:rotate(90deg);}
.hist-nav-btn.next svg{transform:rotate(-90deg);}
.history-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.hist-dow{
  text-align:center;
  font-size:10.5px;
  font-weight:800;
  color:var(--ink-soft);
  text-transform:uppercase;
  padding-bottom:2px;
}
.hist-cell{
  aspect-ratio:1;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--surface);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  color:var(--ink);
  font-size:12.5px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.hist-cell.empty{border:none;background:none;cursor:default;}
.hist-cell.future{color:var(--ink-soft);opacity:.4;cursor:default;}
.hist-cell.today{border-color:var(--rose);}
.hist-cell.done{background:var(--rose-soft);}
.hist-cell.selected{border-color:var(--rose);background:var(--rose);color:var(--on-rose);}
.hist-dot{width:5px;height:5px;border-radius:50%;background:var(--rose);}
.hist-cell.selected .hist-dot{background:var(--on-rose);}
.hist-hint{font-size:13px;color:var(--ink-soft);text-align:center;padding:16px 8px;}
.hist-detail{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.hist-detail h4{font-size:15px;font-weight:700;color:var(--ink);}
.hist-tag{font-size:13px;color:var(--rose-deep);font-weight:700;display:flex;align-items:center;gap:6px;}
.hist-tag svg{width:15px;height:15px;flex:none;}
.hist-empty{font-size:13px;color:var(--ink-soft);}
.hist-exercise-list{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.hist-ex-row{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--ink-soft);
  padding:6px 0;
  border-top:1px solid var(--line);
}
.hist-ex-row span:first-child{color:var(--ink);font-weight:600;}

/* ---------- tabs ---------- */
.tabs{
  display:flex;
  gap:8px;
  border-bottom:1px solid var(--line);
}
.tab{
  border:none;
  background:transparent;
  padding:10px 4px 12px;
  font-size:14px;
  font-weight:700;
  color:var(--ink-soft);
  cursor:pointer;
  position:relative;
}
.tab[data-active="true"]{color:var(--rose-deep);}
.tab[data-active="true"]::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-1px;
  height:2px;
  background:var(--rose);
  border-radius:2px;
}

/* ---------- hero / workout header ---------- */
.workout-hero{
  background:linear-gradient(135deg,var(--rose) 0%, var(--rose-soft) 100%);
  border-radius:22px;
  padding:20px 20px 18px;
  color:var(--on-rose);
  box-shadow:var(--shadow);
}
.workout-hero .kicker{
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  opacity:.85;margin-bottom:6px;
}
.workout-hero h2{font-size:24px;font-weight:600;color:var(--on-rose);}
.workout-hero .meta{
  display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;
}
.meta-chip{
  background:rgba(255,224,239,0.18);
  border:1px solid rgba(255,224,239,0.32);
  padding:6px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.meta-chip svg{width:13px;height:13px;}

.rest-day-hero{
  background:var(--surface-tint);
  border:1px dashed var(--rose-soft);
  border-radius:22px;
  padding:26px 20px;
  text-align:center;
  color:var(--ink);
}
.rest-day-hero h2{font-size:22px;margin-bottom:8px;}
.rest-day-hero p{color:var(--ink-soft);font-size:14px;line-height:1.5;}

/* ---------- section ---------- */
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fonte);
  margin:2px 0 2px;
}
.section-label .n{
  width:20px;height:20px;border-radius:50%;
  background:var(--fonte-soft);color:var(--fonte);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
}
.callout{
  font-size:12.5px;
  color:var(--ink-soft);
  background:var(--surface-tint);
  border-left:3px solid var(--rose);
  padding:9px 12px;
  border-radius:10px;
  line-height:1.5;
}

.stretch-row{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
}
.stretch-top{
  display:flex;
  gap:12px;
  align-items:flex-start;
  cursor:pointer;
}
.stretch-top:active{opacity:.85;}
.stretch-row .idx{
  font-family:"Fraunces",serif;
  font-size:18px;
  color:var(--rose);
  font-weight:600;
  flex:none;
  width:20px;
}
.stretch-check{
  font-family:"Fraunces",serif;
  font-size:14px;
  font-weight:700;
  color:var(--rose);
  flex:none;
  width:26px;height:26px;
  margin-top:-2px;
  border-radius:50%;
  border:1.5px solid var(--line);
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.stretch-check svg{width:13px;height:13px;}
.stretch-check[data-done="true"]{background:var(--success);border-color:var(--success);color:var(--paper);}
.stretch-row .body{flex:1;}
.stretch-row .name{font-weight:700;font-size:14.5px;margin-bottom:3px;}
.stretch-row .dose{font-size:12px;color:var(--rose-deep);font-weight:700;}
.stretch-row .cue{font-size:13px;color:var(--ink-soft);line-height:1.48;}
.stretch-details{padding-top:8px;padding-left:32px;}
.stretch-row[data-expanded="true"] .chevron{transform:rotate(180deg);color:var(--rose);}

/* ---------- exercise card ---------- */
.exercise{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:var(--shadow-sm);
}
.exercise-top{display:flex;gap:12px;align-items:flex-start;cursor:pointer;}
.exercise-top:active{opacity:.85;}
.chevron{
  flex:none;
  width:22px;height:22px;
  margin-top:2px;
  color:var(--ink-soft);
  transition:transform .2s ease;
}
.chevron svg{width:100%;height:100%;}
.exercise[data-expanded="true"] .chevron{transform:rotate(180deg);color:var(--rose);}
.exercise-details{padding-top:2px;}
.exercise-idx{
  font-family:"Fraunces",serif;
  font-size:20px;
  font-weight:600;
  color:var(--rose);
  flex:none;
  width:24px;
}
.exercise-head{flex:1;min-width:0;}
.exercise-head h3{font-size:16px;font-weight:700;color:var(--ink);}
.exercise-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.badge{
  font-size:11.5px;font-weight:700;
  padding:4px 9px;
  border-radius:999px;
  background:var(--fonte-soft);
  color:var(--fonte);
}
.badge.rest{background:var(--rose-soft);color:var(--rose-deep);}
.exercise-cue{
  font-size:13.5px;
  color:var(--ink-soft);
  line-height:1.55;
  padding-left:36px;
}
.exercise-note{
  font-size:12.5px;
  color:var(--rose-deep);
  background:var(--rose-soft);
  padding:8px 10px;
  border-radius:10px;
  margin-left:36px;
  line-height:1.5;
  font-weight:600;
}
.sets-row{
  display:flex;
  gap:8px;
  padding-left:36px;
  flex-wrap:wrap;
}
.weight-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding-left:36px;
  flex-wrap:wrap;
}
.weight-label{font-size:12px;font-weight:700;color:var(--fonte);}
.weight-input{
  width:66px;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:7px 8px;
  font-size:14px;
  font-weight:700;
  color:var(--ink);
  background:var(--paper);
  font-variant-numeric:tabular-nums;
}
.weight-input:focus{outline:none;border-color:var(--rose);}
.weight-unit{font-size:12px;color:var(--ink-soft);font-weight:700;}
.weight-last{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
.set-dot{
  width:38px;height:38px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;
  color:var(--ink-soft);
  cursor:pointer;
  transition:all .15s ease;
  flex:none;
}
.set-dot:active{transform:scale(.92);}
.set-dot[data-done="true"]{
  background:var(--success);
  border-color:var(--success);
  color:var(--paper);
}

/* ---------- complete button ---------- */
.complete-btn{
  border:none;
  border-radius:16px;
  padding:15px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--rose);
  color:var(--on-rose);
  box-shadow:var(--shadow);
}
.complete-btn[data-done="true"]{
  background:var(--success-soft);
  color:var(--success);
  box-shadow:none;
  border:1.5px solid var(--success);
}
.complete-btn svg{width:18px;height:18px;}

.cooldown{
  display:flex;gap:10px;align-items:center;
  font-size:13px;color:var(--ink-soft);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px 14px;
}
.cooldown b{color:var(--ink);}

/* ---------- morning sections ---------- */
.morning-section{display:flex;flex-direction:column;gap:10px;}

/* ---------- timer overlay ---------- */
.timer-overlay{
  position:fixed;
  inset:0;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}
.timer-card{
  background:var(--surface);
  border-radius:28px;
  padding:28px 26px 26px;
  width:100%;
  max-width:340px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.timer-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);}
.timer-ring-wrap{position:relative;width:220px;height:220px;}
.timer-ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.timer-ring-wrap .track{fill:none;stroke:var(--line);stroke-width:12;}
.timer-ring-wrap .progress{fill:none;stroke:var(--rose);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear;}
.timer-time{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:"Figtree",sans-serif;
  font-size:44px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.timer-next{font-size:13px;color:var(--ink-soft);text-align:center;}
.timer-controls{display:flex;gap:10px;align-items:center;}
.timer-controls button{
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.timer-adjust{
  width:46px;height:46px;
  background:var(--fonte-soft);
  color:var(--fonte);
  font-size:13px;
  border-radius:50%;
}
.timer-toggle{
  width:64px;height:64px;
  border-radius:50%;

/* ============ STATE ============ */
var STORE_KEY = "rf-state-v1";
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {restDayByWeek:{}, completed:{}, setChecks:{}, morningChecks:{}, weights:{}, levels:{}, pilates:{}, unit:"lb", silentMode:false, tab:"workout"};
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
var state = loadState();
if(!state.restDayByWeek){
  state.restDayByWeek = {};
  if(state.restDay && state.restWeek) state.restDayByWeek[state.restWeek] = state.restDay;
}

/* ============ DATE HELPERS ============ */
function pad(n){return n<10?"0"+n:""+n;}
function dateKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function isoWeekKey(d){
  var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var day = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-day+3);
  var firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  var week = 1+Math.round(((date-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return date.getUTCFullYear()+"-W"+pad(week);
}
var DOW_TO_KEY = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MONTHS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

var today = new Date();
var todayKey = dateKey(today);
var todayDow = DOW_TO_KEY[today.getDay()];
var currentIsoWeek = isoWeekKey(today);

if(!state.selectedDay) state.selectedDay = todayDow;
if(!state.tab) state.tab = "workout";
if(!state.weights) state.weights = {};
if(!state.levels) state.levels = {};
if(!state.morningChecks) state.morningChecks = {};
if(!state.pilates) state.pilates = {};
if(state.silentMode === undefined) state.silentMode = false;
if(!state.unit) state.unit = "lb";

function formatFullDate(d){
  return DAY_LABEL[DOW_TO_KEY[d.getDay()]]+" "+d.getDate()+" "+MONTHS_FR[d.getMonth()];
}

/* ============ DERIVED PROGRAM LOGIC ============ */
function currentRestDay(){ return state.restDayByWeek[currentIsoWeek] || null; }
function muscleForDay(dayKey){
  if(FIXED_MUSCLE[dayKey]) return FIXED_MUSCLE[dayKey];
  // samedi / dimanche
  var rest = currentRestDay();
  if(!rest) return null; // not chosen yet this week
  if(dayKey === rest) return "rest";
  return "abs";
}

function completedFor(dayKeyDate){
  return state.completed[dayKeyDate] || {};
}
function weekDates(){
  // Monday-based week containing "today"
  var dow = (today.getDay()+6)%7; // 0=lundi
  var monday = new Date(today);
  monday.setDate(today.getDate()-dow);
  var arr = [];
  for(var i=0;i<7;i++){
    var d = new Date(monday);
    d.setDate(monday.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function weekProgress(){
  var dates = weekDates();
  var done = 0, total = 0;
  dates.forEach(function(d){
    var dow = DOW_TO_KEY[d.getDay()];
    var m = muscleForDay(dow);
    if(m && m !== "rest"){
      total++;
      var c = completedFor(dateKey(d));
      if(c.workout) done++;
    }
  });
  return {done:done, total:total};
}

/* ============ STREAK ============ */
function dayQualifies(d){
  var dow = DOW_TO_KEY[d.getDay()];
  if(FIXED_MUSCLE[dow]){
    var c = completedFor(dateKey(d));
    return !!c.workout;
  }
  var wk = isoWeekKey(d);
  var chosen = state.restDayByWeek[wk];
  if(!chosen) return false;
  if(chosen === dow) return true;
  var c2 = completedFor(dateKey(d));
  return !!c2.workout;
}
function computeStreak(){
  var d = new Date(today);
  if(!dayQualifies(d)) d.setDate(d.getDate()-1);
  var streak = 0;
  var guard = 0;
  while(dayQualifies(d) && guard < 1000){
    streak++;
    d.setDate(d.getDate()-1);
    guard++;
  }
  return streak;
}

/* ============ PILATES ============ */
var PILATES_DAYS = ["mardi","mercredi","jeudi"];
function isPilatesDay(d){ return PILATES_DAYS.indexOf(DOW_TO_KEY[d.getDay()]) !== -1; }
function pilatesWent(dateStr){ return !!(state.pilates[dateStr] && state.pilates[dateStr].went); }
function computePilatesStreak(){
  var d = new Date(today);
  if(isPilatesDay(d) && !pilatesWent(dateKey(d))) d.setDate(d.getDate()-1);
  var streak = 0, guard = 0;
  while(guard < 1000){
    guard++;
    if(isPilatesDay(d)){
      if(pilatesWent(dateKey(d))){ streak++; d.setDate(d.getDate()-1); continue; }
      break;
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

/* ============ HISTORY (any date, not just current week) ============ */
function muscleForDate(date){
  var dow = DOW_TO_KEY[date.getDay()];
  if(FIXED_MUSCLE[dow]) return FIXED_MUSCLE[dow];
  var rest = state.restDayByWeek[isoWeekKey(date)];
  if(!rest) return null;
  if(dow === rest) return "rest";
  return "abs";
}

      '<button class="unit-chip" id="unitToggle">'+state.unit.toUpperCase()+'</button>'+
    '</div>'+
  '</header>';

  html += '<div class="stats-row">'+
    '<div class="stat-card"><p class="num">'+ICONS.flame+streak+'</p><p class="label">Jours de suite</p></div>'+
    '<div class="stat-card"><p class="num">'+wp.done+'<span class="num-sub">/'+wp.total+'</span></p><p class="label">Séances cette semaine</p></div>'+
  '</div>';

  // week strip
  html += '<nav class="week-strip" id="weekStrip">';
  DAYS.forEach(function(dk){
    var m = muscleForDay(dk);
    var isToday = dk === todayDow;
    var isSelected = dk === state.selectedDay;
    var dObj = weekDates()[DAYS.indexOf(dk)];
    var dtKey = dateKey(dObj);
    var done = !!(completedFor(dtKey).workout);
    var code = m ? MUSCLE_CODE[m] : "?";
    html += '<div class="day-pill" data-day="'+dk+'" data-muscle="'+(m||"unset")+'" data-today="'+isToday+'" data-selected="'+isSelected+'" data-done="'+done+'">'+
      '<span class="dow">'+DAY_SHORT[dk]+'</span>'+
      '<span class="code">'+code+'</span>'+
      '<span class="bar"></span>'+
    '</div>';
  });
  html += '</nav>';

  // morning stretch quick access
  html += '<div class="morning-card" id="morningCard">'+

  // pilates tracker (only on the days it happens)

      '<div class="pilates-head">'+

    if(pRec.went){
      html += '<div class="pilates-focus">'+
        '<label for="pilatesFocus">Travaillé aujourd\'hui</label>'+

function renderMain(){
  var mainView = document.getElementById("mainView");
  if(state.tab === "morning"){
    mainView.innerHTML = renderMorningHTML();

  bindMainEvents();

/* ============ HISTORY / CALENDAR ============ */
var historyMonthOffset = 0;
var historySelectedDate = null;
var HIST_DOW = ["L","M","M","J","V","S","D"];

function renderHistoryHTML(){
  var base = new Date(today.getFullYear(), today.getMonth()+historyMonthOffset, 1);
  var year = base.getFullYear(), month = base.getMonth();
  var monthName = MONTHS_FR[month];
  var monthLabel = monthName.charAt(0).toUpperCase()+monthName.slice(1)+" "+year;
  var firstDow = (new Date(year,month,1).getDay()+6)%7;
  var daysInMonth = new Date(year, month+1, 0).getDate();

  var html = '<div class="history-nav">'+
    '<button class="hist-nav-btn" id="histPrev" aria-label="Mois précédent">'+ICONS.chevron+'</button>'+
    '<h3>'+monthLabel+'</h3>'+
    '<button class="hist-nav-btn next" id="histNext" aria-label="Mois suivant">'+ICONS.chevron+'</button>'+
  '</div>';

  html += '<div class="history-grid">';
  HIST_DOW.forEach(function(l){ html += '<div class="hist-dow">'+l+'</div>'; });
  for(var i=0;i<firstDow;i++){ html += '<div class="hist-cell empty"></div>'; }
  for(var day=1; day<=daysInMonth; day++){
    var d = new Date(year, month, day);
    var dk = dateKey(d);
    var c = completedFor(dk);
    var hasWorkout = !!c.workout;
    var hasMorning = !!c.morning;
    var isFuture = d > today;
    var isToday = dk === todayKey;
    var isSelected = historySelectedDate === dk;
    var cls = "hist-cell"+(hasWorkout?" done":"")+(isSelected?" selected":"")+(isToday?" today":"");
    if(isFuture){
      html += '<div class="'+cls+' future"><span class="hist-daynum">'+day+'</span></div>';
    } else {
      html += '<button class="'+cls+'" data-date="'+dk+'">'+
        '<span class="hist-daynum">'+day+'</span>'+
        ((hasWorkout||hasMorning) ? '<span class="hist-dot"></span>' : '')+
      '</button>';
    }
  }
  html += '</div>';

  if(historySelectedDate){
    html += renderHistoryDetail(historySelectedDate);
  } else {
    html += '<p class="hist-hint">Touche un jour marqué pour voir les détails de ta séance.</p>';
  }
  return html;
}

function renderHistoryDetail(dk){
  var parts = dk.split("-");
  var d = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  var c = completedFor(dk);
  var label = formatFullDate(d);
  var html = '<div class="hist-detail"><h4>'+label+'</h4>';

  if(!c.workout && !c.morning){
    html += '<p class="hist-empty">Aucune séance enregistrée ce jour-là.</p></div>';
    return html;
  }
  if(c.morning){
    html += '<p class="hist-tag">'+ICONS.check+' Étirement matinal fait</p>';
  }
  if(c.workout){
    var m = muscleForDate(d);
    if(m === "rest"){
      html += '<p class="hist-tag">'+ICONS.check+' Jour de repos</p>';
    } else if(m && WORKOUTS[m]){
      var w = WORKOUTS[m];
      html += '<p class="hist-tag">'+ICONS.check+' '+w.title+'</p><div class="hist-exercise-list">';
      w.exercises.forEach(function(ex, idx){
        var exId = m+"__"+idx;
        var checks = state.setChecks[dk+"|"+exId] || [];
        var doneSets = checks.filter(Boolean).length;
        html += '<div class="hist-ex-row"><span>'+ex.name+'</span><span class="hist-ex-sets">'+doneSets+'/'+ex.sets+' séries</span></div>';
      });
      html += '</div>';
    }
  }
  html += '</div>';
  return html;
}

function renderWorkoutHTML(dayKey){
  var m = muscleForDay(dayKey);
  var dIndex = DAYS.indexOf(dayKey);
  var dObj = weekDates()[dIndex];
  var dtKey = dateKey(dObj);
  var done = !!(completedFor(dtKey).workout);

  if(m === null){
    return '<div class="rest-day-hero"><h2>Choisis d\'abord ton repos</h2><p>Touche Samedi ou Dimanche ci-dessus pour choisir ton jour de repos cette semaine.</p></div>';
  }
  if(m === "rest"){
    return '<div class="rest-day-hero"><h2>Repos bien mérité</h2><p>Aucune séance aujourd\'hui — profites-en pour récupérer. Tu peux quand même faire ton étirement matinal dans l\'autre onglet.</p>'+
      '<button class="rest-changer" id="restChanger">Changer mon jour de repos</button></div>';
  }

  var w = WORKOUTS[m];
  var html = "";
  html += '<div class="workout-hero"><p class="kicker">'+DAY_LABEL[dayKey]+'</p><h2>'+w.title+'</h2>'+
    '<div class="meta"><span class="meta-chip">'+ICONS.clock+' '+w.est+'</span><span class="meta-chip">'+w.exercises.length+' exercises</span></div></div>';

  html += '<p class="callout">3 séries maximum par exercice — fais compter la dernière, pousse-la jusqu\'à l\'échec.</p>';

  html += '<div class="section-label"><span class="n">•</span> Warm-Up — Stay Injury-Free</div>';
  w.warmup.forEach(function(s,i){
    html += renderStretchRow(s, i+1);
  });

  if(w.calloutText){
    html += '<p class="callout">'+w.calloutText+'</p>';
  }
  if(w.circuitLabel){
    html += '<p class="callout">'+w.circuitLabel+'</p>';
  }

  html += '<div class="section-label"><span class="n">•</span> Exercises</div>';
  w.exercises.forEach(function(ex, i){
    html += renderExercise(ex, i, m, dtKey);
  });

  html += '<div class="cooldown">'+ICONS.clock+'<span><b>Cooldown — </b>'+w.cooldown+'</span></div>';

  html += '<button class="complete-btn" id="completeBtn" data-done="'+done+'">'+ICONS.check+' '+(done? "Séance terminée !" : "Marquer la séance comme terminée")+'</button>';

  return html;
}

function renderStretchRow(s, idx, checkKey){
  var idxHtml;
  if(checkKey){
    var isDone = !!state.morningChecks[checkKey];
    idxHtml = '<button class="stretch-check" data-check="'+checkKey+'" data-idx="'+idx+'" data-done="'+isDone+'">'+(isDone?ICONS.check:idx)+'</button>';
  } else {
    idxHtml = '<span class="idx">'+idx+'</span>';
  }
  return '<div class="stretch-row" data-expanded="false">'+
    '<div class="stretch-top" data-toggle="true">'+
      idxHtml+
      '<div class="body">'+
        '<p class="name">'+s.name+'</p>'+
        '<p class="dose">'+s.dose+'</p>'+
      '</div>'+
      '<span class="chevron">'+ICONS.chevron+'</span>'+
    '</div>'+
    '<div class="stretch-details" hidden><p class="cue">'+s.cue+'</p></div>'+
  '</div>';
}

function renderExercise(ex, idx, muscleKey, dtKey){
  var exId = muscleKey+"__"+idx;
  var stateKey = dtKey+"|"+exId;
  var checks = state.setChecks[stateKey] || [];
  var setsHtml = "";
  for(var s=0;s<ex.sets;s++){
    var isDone = !!checks[s];
    setsHtml += '<div class="set-dot" data-ex="'+exId+'" data-set="'+s+'" data-done="'+isDone+'">'+(isDone?"✓":(s+1))+'</div>';
  }
  var restLabel = formatRest(ex.rest);
  var isLevel = ex.trackAs === "level";
  var trackRowHtml;
  if(isLevel){
    var savedL = state.levels[exId];
    var lVal = savedL ? savedL.value : "";
    var lastLevelLine = savedL ? ("Dernière fois : niveau "+savedL.value) : "Pas encore de niveau enregistré";
    trackRowHtml = '<div class="weight-row">'+
        '<span class="weight-label">Niveau</span>'+
        '<input type="number" inputmode="numeric" step="1" class="level-input" data-ex="'+exId+'" value="'+lVal+'" placeholder="—" />'+
        '<span class="weight-last">'+lastLevelLine+'</span>'+
      '</div>';
  } else {
    var savedW = state.weights[exId];
    var wVal = savedW ? savedW.value : "";
    var lastLine = savedW ? ("Dernière fois : "+savedW.value+" "+savedW.unit) : "Pas encore de poids enregistré";
    trackRowHtml = '<div class="weight-row">'+
        '<span class="weight-label">Poids</span>'+
        '<input type="number" inputmode="decimal" step="0.5" class="weight-input" data-ex="'+exId+'" value="'+wVal+'" placeholder="—" />'+
        '<span class="weight-unit">'+state.unit+'</span>'+
        '<span class="weight-last">'+lastLine+'</span>'+
      '</div>';
  }
  var html = '<div class="exercise" data-exid="'+exId+'">'+
    '<div class="exercise-top" data-toggle="'+exId+'">'+
      '<span class="exercise-idx">'+(idx+1)+'</span>'+
      '<div class="exercise-head">'+
        '<h3>'+ex.name+'</h3>'+
        '<div class="exercise-badges">'+
          '<span class="badge">'+ex.sets+' × '+ex.reps+'</span>'+
          '<span class="badge rest">Rest '+restLabel+'</span>'+
        '</div>'+
      '</div>'+
      '<span class="chevron">'+ICONS.chevron+'</span>'+
    '</div>'+
    '<div class="exercise-details" hidden>'+
      '<p class="exercise-cue">'+ex.cue+'</p>'+
      (ex.note ? '<p class="exercise-note">'+ex.note+'</p>' : '')+
    '</div>';
  html += '<div class="sets-row">'+setsHtml+'</div>';
  html += trackRowHtml;
  html += '</div>';
  return html;
}

function renderMorningHTML(){
  var dtKey = todayKey;
  var done = !!(completedFor(dtKey).morning);
  var html = '<div class="workout-hero"><p class="kicker">Chaque matin</p><h2>'+MORNING.title+'</h2>'+
    '<div class="meta"><span class="meta-chip">'+ICONS.clock+' '+MORNING.est+'</span></div></div>';

      state.tab = "workout";
      saveState();
      render();

  document.getElementById("unitToggle").addEventListener("click", function(){
    state.unit = state.unit === "lb" ? "kg" : "lb";
    saveState();
    render();
  });

  document.getElementById("soundToggle").addEventListener("click", function(){
    state.silentMode = !state.silentMode;
    saveState();
    render();
  });

  document.getElementById("morningCard").addEventListener("click", function(){
    state.tab = "morning";
    saveState();
    renderMain();

      var rec = state.pilates[todayKey] || {went:false, focus:"abs"};
      rec.went = !rec.went;
      state.pilates[todayKey] = rec;
      saveState();
      render();

  var pilatesFocus = document.getElementById("pilatesFocus");
  if(pilatesFocus){
    pilatesFocus.addEventListener("change", function(){
      var rec = state.pilates[todayKey] || {went:true, focus:"abs"};

      state.pilates[todayKey] = rec;

      renderMain();

  var histPrev = document.getElementById("histPrev");
  if(histPrev){
    histPrev.addEventListener("click", function(){
      historyMonthOffset--;
      historySelectedDate = null;

  document.querySelectorAll(".exercise-top[data-toggle]").forEach(function(top){

      card.setAttribute("data-expanded", (!expanded).toString());
    });

  document.querySelectorAll(".stretch-check[data-check]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var key = btn.getAttribute("data-check");
      var done = !state.morningChecks[key];
      state.morningChecks[key] = done;
      saveState();
      btn.setAttribute("data-done", done.toString());
      btn.innerHTML = done ? ICONS.check : btn.getAttribute("data-idx");
    });

  document.querySelectorAll(".set-dot").forEach(function(dot){
    dot.addEventListener("click", function(){
      var exId = dot.getAttribute("data-ex");
      var setIdx = parseInt(dot.getAttribute("data-set"),10);
      var dtKey = dateKey(weekDates()[DAYS.indexOf(state.selectedDay)]);
      var stateKey = dtKey+"|"+exId;
      var checks = state.setChecks[stateKey] || [];
      var wasDone = !!checks[setIdx];
      checks[setIdx] = !wasDone;
      state.setChecks[stateKey] = checks;
      saveState();
      dot.setAttribute("data-done", (!wasDone).toString());
      dot.textContent = (!wasDone) ? "✓" : (setIdx+1);

      if(!wasDone){
        var m = muscleForDay(state.selectedDay);
        var idx = parseInt(exId.split("__")[1],10);
        var ex = WORKOUTS[m].exercises[idx];
        if(ex.rest > 0){
          var nextLabel = (idx+1 < WORKOUTS[m].exercises.length) ? WORKOUTS[m].exercises[idx+1].name : "fin de la séance";
          if(setIdx+1 < ex.sets){ nextLabel = ex.name + " — série "+(setIdx+2); }
          startTimer(ex.rest, ex.name, nextLabel);

      }

  document.querySelectorAll(".weight-input").forEach(function(input){
    input.addEventListener("change", function(){
      var exId = input.getAttribute("data-ex");

  var completeBtn = document.getElementById("completeBtn");

      var c = state.completed[dtKey] || {};

    });

  var morningBtn = document.getElementById("morningCompleteBtn");
  if(morningBtn){
    morningBtn.addEventListener("click", function(){
      var c = state.completed[todayKey] || {};
      c.morning = !c.morning;
      state.completed[todayKey] = c;
      saveState();
      renderMain();
    });
  }
}

/* ============ AUDIO (beep-beep) ============ */
var audioCtx = null;
function unlockAudioOnce(){
  if(audioCtx) return;
  document.body.addEventListener("pointerdown", function initAudio(){
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
    document.body.removeEventListener("pointerdown", initAudio);
  }, {once:true});
}
function playBeepBeep(){
  if(state.silentMode){
    if(navigator.vibrate){ try{ navigator.vibrate([180,90,180,90,180]); }catch(e){} }
    return;
  }
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    var now = audioCtx.currentTime;
    var pattern = [0, 0.22, 0.55, 0.77]; // beep, beep, (gap), beep, beep
    pattern.forEach(function(offset){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.9, now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.2);
    });
  }catch(e){}
  if(navigator.vibrate){ try{ navigator.vibrate([180,90,180,90,180]); }catch(e){} }
}

/* ============ WAKE LOCK ============ */
var wakeLock = null;
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && timerState.running) requestWakeLock();
});

/* ============ REST TIMER ============ */
var timerOverlay = document.getElementById("timerOverlay");
var timerRing = document.getElementById("timerRing");
var timerTime = document.getElementById("timerTime");
var timerLabel = document.getElementById("timerLabel");
var timerNext = document.getElementById("timerNext");
var timerToggle = document.getElementById("timerToggle");
var RING_CIRC = 2*Math.PI*70;
timerRing.style.strokeDasharray = RING_CIRC;

var timerState = {total:180, remaining:180, running:false, tickHandle:null, exName:"", nextName:""};

function startTimer(seconds, exName, nextName){
  timerState.total = seconds;
  timerState.remaining = seconds;
  timerState.running = true;
  timerState.exName = exName;
  timerState.nextName = nextName;
  timerLabel.textContent = "Repos — "+exName;
  timerNext.textContent = "Prochain : "+nextName;
  document.getElementById("audioNote").textContent = state.silentMode ?
    "Mode silencieux activé — tu sentiras une vibration à la fin." :
    "Le bip sonne dans tes AirPods à la fin — garde l'app ouverte et le son allumé.";
  timerOverlay.hidden = false;
  timerOverlay.removeAttribute("data-done");
  updateToggleIcon();
  requestWakeLock();
  tickLoop();
}

function tickLoop(){
  clearInterval(timerState.tickHandle);
  updateTimerVisual();
  timerState.tickHandle = setInterval(function(){
    if(!timerState.running) return;
    timerState.remaining -= 1;
    if(timerState.remaining <= 0){
      timerState.remaining = 0;
      updateTimerVisual();
      clearInterval(timerState.tickHandle);
      timerState.running = false;
      playBeepBeep();
      timerOverlay.setAttribute("data-done","true");
      timerLabel.textContent = "C'est reparti !";
      timerNext.textContent = timerState.nextName;
      releaseWakeLock();
      setTimeout(function(){ timerOverlay.hidden = true; }, 2600);
      return;
    }
    updateTimerVisual();
  }, 1000);
}

function updateTimerVisual(){
  var frac = timerState.remaining / timerState.total;
  var offset = RING_CIRC * (1-frac);
  timerRing.style.strokeDashoffset = offset;
  var m = Math.floor(timerState.remaining/60);
  var s = timerState.remaining%60;
  timerTime.textContent = m+":"+pad(s);
}

function updateToggleIcon(){
  timerToggle.innerHTML = timerState.running ? ICONS.pause : ICONS.play;
  timerToggle.setAttribute("aria-label", timerState.running ? "Pause" : "Reprendre");
}

document.getElementById("timerToggle").addEventListener("click", function(){
  timerState.running = !timerState.running;
  updateToggleIcon();
  if(timerState.running) requestWakeLock(); else releaseWakeLock();
});
document.getElementById("timerPlus").addEventListener("click", function(){
  timerState.remaining = Math.min(timerState.remaining+30, timerState.total+600);
  timerState.total = Math.max(timerState.total, timerState.remaining);
  updateTimerVisual();
});
document.getElementById("timerMinus").addEventListener("click", function(){
  timerState.remaining = Math.max(timerState.remaining-30, 0);
  updateTimerVisual();
});
document.getElementById("timerSkip").addEventListener("click", function(){
  clearInterval(timerState.tickHandle);
  timerState.running = false;
  releaseWakeLock();
  timerOverlay.hidden = true;
});

/* ============ ONE-TIME SEED (manual data restore, triggered by URL param) ============ */
(function applySeedIfRequested(){
  try{
    var params = new URLSearchParams(location.search);
    if(params.get("seed") !== "weekdone") return;
    var wd = weekDates();
    for(var i=0;i<5;i++){
      var k = dateKey(wd[i]);
      state.completed[k] = state.completed[k] || {};
      state.completed[k].workout = true;
    }
    state.restDayByWeek[isoWeekKey(wd[0])] = "dimanche";
    var prevSat = new Date(wd[0]); prevSat.setDate(prevSat.getDate()-2);
    var prevSun = new Date(wd[0]); prevSun.setDate(prevSun.getDate()-1);
    state.restDayByWeek[isoWeekKey(prevSun)] = "dimanche";
    var prevSatKey = dateKey(prevSat);
    state.completed[prevSatKey] = state.completed[prevSatKey] || {};
    state.completed[prevSatKey].workout = true;
    saveState();
    var url = new URL(location.href);
    url.searchParams.delete("seed");
    location.replace(url.toString());
  }catch(e){}
})();

/* ============ INIT ============ */
render();

})();
</script>
